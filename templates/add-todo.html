
{% include "layout.html" %}
<div class="container">
    <div class="card">
        <div class="card-header">
            Make a new TODO
        </div>
        <div class="card-body">
            <form id="todoForm">
                <div class="form-group">
                    <lablel>Title</lablel>
                    <input type="text" class="form-control" name="title" required>
                </div>
                <div class="form-group">
                    <lablel>Description</lablel>
                    <textarea class="form-control" rows="3" name="description" required>
                    </textarea>
                </div>
                <div class="form-group">
                    <lablel>Priority</lablel>
                    <select class="form-control" name="priority">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Add</button>
                <a href="/todos/todo" class="btn btn-success">Back to Todos</a>
            </form>
        </div>
    </div>
</div>
